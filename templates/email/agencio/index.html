<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block email_title %}Agencio{% endblock %}</title>
  <!-- Email-safe inline styles; tables for older clients -->
  <style type="text/css">
    body { margin: 0; padding: 0; background-color: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .wrap { max-width: 600px; margin: 0 auto; }
    .card { background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .header { background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%); color: #ffffff; padding: 24px 28px; }
    .header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .body { padding: 28px; color: #2d3748; font-size: 15px; line-height: 1.6; }
    .body p { margin: 0 0 16px; }
    .muted { color: #718096; font-size: 14px; }
    .box { background: #edf2f7; border-radius: 6px; padding: 16px 18px; margin: 20px 0; font-size: 14px; }
    .box strong { color: #2d3748; }
    .footer { padding: 20px 28px 28px; text-align: center; border-top: 1px solid #e2e8f0; background: #fafafa; }
    .footer a { color: #2b6cb0; text-decoration: none; }
    .footer .brand { font-size: 13px; color: #718096; margin-top: 8px; }
    .footer .powered { font-size: 12px; color: #a0aec0; margin-top: 12px; }
    .footer .powered a { color: #3182ce; font-weight: 500; }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f6f8;padding:24px 12px;">
    <tr>
      <td align="center">
        <div class="wrap">
          <table role="presentation" class="card" width="100%" cellspacing="0" cellpadding="0" border="0">
            {% if branding_logo_url %}
            <tr>
              <td style="background:#ffffff;padding:24px 28px 16px;text-align:center;border-bottom:1px solid #e2e8f0;">
                <img
                  src="{{ branding_logo_url }}"
                  alt="Agencio — Agency Management Platform"
                  width="320"
                  style="max-width:100%;height:auto;display:block;margin:0 auto;border:0;outline:none;text-decoration:none;"
                />
              </td>
            </tr>
            {% endif %}
            <tr>
              <td class="header">
                <h1>{% block header_title %}Agencio{% endblock %}</h1>
                {% block header_subtitle %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td class="body">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td class="footer">
                {% block footer_extra %}{% endblock %}
                <div class="brand">Student services notification</div>
                <div class="powered">
                  Powered by <a href="https://agencio.xyz" target="_blank" rel="noopener noreferrer">agencio.xyz</a>
                </div>
              </td>
            </tr>
          </table>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
