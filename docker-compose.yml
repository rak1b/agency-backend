# Default / live-style stack. For an isolated demo stack (separate ports + DB volume), use
# docker-compose.demo.yml instead.
#
# Host publish port: set WEB_PORT in .env / Dokploy if you see "port is already allocated".
# ``IS_LIVE=true`` in .env for this stack (Postgres). ``IS_LIVE=false`` = local laptop only (SQLite).
networks:
  ps_inventory_net:

services:
  web:
    build: .
    restart: always
    env_file:
      - .env
    # Startup: Dockerfile ENTRYPOINT (entrypoint.sh) runs migrate, collectstatic, gunicorn.
    volumes:
      - ./static:/app/static
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "${WEB_PORT:-38080}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # With IS_LIVE=true, Django sets SECURE_SSL_REDIRECT; internal HTTP must look "secure"
      # (same as Traefik) or the check gets a 301 and fails.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(r, timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s
    networks:
      - ps_inventory_net

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ps_inventory_net

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - ps_inventory_net

volumes:
  postgres_data:
  static:
  media:
  logs:
